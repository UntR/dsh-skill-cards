<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能卡片 · 游戏王风格原型 v2</title>
<style>
  :root {
    --bg: #12121c;
    --gold: linear-gradient(135deg, #d4a545 0%, #f5d98b 20%, #b8862e 45%, #f7e3a8 60%, #a8761f 85%, #e8c76a 100%);
    --foil-hi: rgba(255, 255, 255, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, #1e1e30 0%, #0c0c14 70%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }
  h1 { font-size: 22px; letter-spacing: 4px; margin-bottom: 6px; color: #d4b46a; }
  .sub { font-size: 13px; color: #888; margin-bottom: 32px; }

  /* ============ 游戏王式卡面（主题变量驱动） ============ */
  .ygo-card {
    /* 主题变量：由 JS 按分类注入；未匹配的新分类用哈希生成的默认值 */
    --frame-color: #8a6a2f;
    --frame-dark: #5c4418;
    --frame-glow: rgba(138, 106, 47, .55);
    --art-grad: linear-gradient(150deg, #34406b, #1a2038 60%, #0d1020);
    width: 260px;
    height: 382px;             /* 官方比例 59×86mm ≈ 0.686 */
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    background: var(--frame-color);
    padding: 9px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.6),
      0 8px 24px rgba(0,0,0,.55),
      inset 0 1px 2px rgba(255,255,255,.35),
      inset 0 -2px 4px rgba(0,0,0,.4);
    transition: transform .25s ease;
  }
  .ygo-card .inner {
    width: 100%; height: 100%;
    border-radius: 6px;
    background: linear-gradient(160deg, #2a2a35, #17171f);
    border: 1px solid rgba(0,0,0,.55);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.06);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .card-name {
    padding: 7px 10px 5px;
    font-size: 14px; font-weight: 700; color: #f5ead0;
    letter-spacing: 1px;
    display: flex; align-items: center; gap: 6px;
    text-shadow: 0 1px 2px #000;
    white-space: nowrap; overflow: hidden;
  }
  .card-name .lv { margin-left: auto; font-size: 10px; color: #ffb84d; letter-spacing: 0; }
  .elem-badge {
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8, transparent 60%), var(--frame-color);
    border: 1px solid #000a;
    box-shadow: 0 0 4px var(--frame-color);
    flex-shrink: 0;
  }
  .card-art {
    margin: 2px 8px;
    height: 190px;
    border-radius: 4px;
    border: 2px solid #3a3020;
    position: relative;
    overflow: hidden;
    background: var(--art-grad);
    display: flex; align-items: center; justify-content: center;
  }
  .card-art .glyph { font-size: 58px; filter: drop-shadow(0 4px 10px #000a); }
  .card-art::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 70% 20%, rgba(255,255,255,.14), transparent 55%);
  }
  .card-desc {
    margin: 4px 8px;
    flex: 1;
    background: linear-gradient(170deg, #e8e0c8, #d6ccae);
    border: 1px solid #9a8a5a;
    border-radius: 4px;
    padding: 7px 8px;
    font-size: 10.5px;
    line-height: 1.55;
    color: #3a3020;
    overflow: hidden;
  }
  .card-desc b { color: #6b4a10; }
  .card-stats {
    padding: 3px 10px 8px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10.5px;
  }
  .card-stats .cat { color: #e0d5b8aa; letter-spacing: 1px; }
  .card-stats .nums { font-family: "Georgia", serif; font-weight: 700; color: #f0e6c8; letter-spacing: 1px; }
  .card-stats .nums span { color: #e8c76a; }

  /* ============ 罕贵度闪卡（光条平移法：光条两端均在卡外，循环衔接无缝） ============ */
  .foil {
    position: absolute; inset: 0; z-index: 5;
    pointer-events: none; overflow: hidden;
    border-radius: 10px;
    opacity: 0;
    transition: opacity .3s;
  }
  .foil::before {
    content: "";
    position: absolute; top: -20%; bottom: -20%;
    width: 45%;
    left: -60%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,.55) 30%,
      rgba(160,220,255,.5) 50%,
      rgba(255,190,120,.5) 70%,
      transparent 100%);
    transform: skewX(-20deg);
    mix-blend-mode: screen;
    animation: foil-sweep 2.4s linear infinite;
  }
  @keyframes foil-sweep {
    from { transform: translateX(0)     skewX(-20deg); }   /* 光条整体在卡片左侧外 */
    to   { transform: translateX(340%)  skewX(-20deg); }   /* 光条整体滑出右侧外 */
  }
  .ygo-card:hover .foil,
  .ygo-card.revealed.sr .foil { opacity: 1; }
  .ygo-card:hover { transform: translateY(-10px) scale(1.04); z-index: 2; }
  .ygo-card.revealed.sr { box-shadow: 0 0 0 1px #0006, 0 8px 24px #000a, 0 0 26px var(--frame-glow); }

  /* ============ 翻面结构 ============ */
  .flip-scene { perspective: 1200px; }
  .flip-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.4,.1,.2,1); }
  .flipped .flip-inner { transform: rotateY(180deg); }
  .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .card-back .flip-face.back { transform: rotateY(180deg); }
  .card-backface {
    width: 100%; height: 100%; border-radius: 10px;
    background: radial-gradient(circle at 50% 42%, #6b5a2e 0%, #4a3c1c 35%, #2e2410 100%);
    border: 9px solid #8a6a2f;
    box-shadow: inset 0 0 0 2px #c9a85566, inset 0 0 30px #000a;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .card-backface::before {
    content: ""; position: absolute; inset: 10px;
    border: 2px solid #c9a85588; border-radius: 50%;
    box-shadow: 0 0 18px #c9a85544, inset 0 0 14px #c9a85533;
  }
  .card-backface::after {
    content: "✦"; font-size: 44px; color: #e8c76a;
    text-shadow: 0 0 16px #f5d98b, 0 0 40px #d4a545;
  }

  /* ============ 布局 ============ */
  .row { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; margin-bottom: 46px; }
  .static .ygo-card { cursor: default; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cell .tag { font-size: 12px; color: #9a8a5a; letter-spacing: 2px; }
  .cell .tag .auto { color: #7aa8d8; }

  /* ============ 抽卡演示区 ============ */
  .gacha-stage {
    width: 100%; max-width: 1100px;
    border: 1px solid #33334a; border-radius: 14px;
    padding: 30px 20px 36px;
    background: radial-gradient(ellipse at 50% 0%, #1c1c2e, #101018);
    display: flex; flex-direction: column; align-items: center;
  }
  .gacha-stage h2 { font-size: 15px; letter-spacing: 3px; color: #9a8a5a; margin-bottom: 22px; }
  .gacha-btn {
    padding: 12px 46px;
    font-size: 15px; letter-spacing: 6px; font-weight: 700;
    color: #2a2008;
    background: var(--gold);
    border: none; border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 18px #d4a54555, inset 0 1px 2px #fff8, inset 0 -2px 4px #0004;
    transition: transform .15s;
  }
  .gacha-btn:hover { transform: scale(1.05); }
  .gacha-btn:disabled { opacity: .45; cursor: default; transform: none; }
  .gacha-row { display: flex; gap: 22px; margin-top: 30px; min-height: 400px; justify-content: center; flex-wrap: wrap; }
  .gacha-slot { width: 260px; height: 382px; position: relative; }
  .gacha-slot .placeholder {
    position: absolute; inset: 0;
    border: 1px dashed #3a3a52; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #3f3f58; font-size: 26px;
  }
  .gacha-slot.reveal-flash::after {
    content: ""; position: absolute; inset: -20px; z-index: 9;
    pointer-events: none; border-radius: 16px;
    background: radial-gradient(circle, rgba(255,230,150,.9), transparent 65%);
    animation: flash .7s ease-out forwards;
  }
  @keyframes flash { from { opacity: 1; transform: scale(.5); } to { opacity: 0; transform: scale(1.6); } }
  .gacha-slot.reveal-flash.sr::after {
    background: radial-gradient(circle, rgba(255,240,190,1), rgba(160,220,255,.5) 45%, transparent 70%);
    animation-duration: 1.1s;
  }
  .gacha-hint { margin-top: 18px; font-size: 12px; color: #666; }

  /* ============ 中文化提示词工具 ============ */
  .i18n-stage {
    width: 100%; max-width: 1100px;
    border: 1px solid #2a3a4a; border-radius: 14px;
    padding: 30px 24px 36px;
    margin-top: 46px;
    background: radial-gradient(ellipse at 50% 0%, #14202e, #0c1018);
    display: flex; flex-direction: column; align-items: center;
  }
  .i18n-stage h2 { font-size: 15px; letter-spacing: 3px; color: #6a9ab8; margin-bottom: 8px; }
  .i18n-stage .sub2 { font-size: 12px; color: #667; margin-bottom: 20px; text-align: center; }
  .i18n-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; }
  .i18n-btn {
    padding: 10px 26px; font-size: 13px; letter-spacing: 2px;
    color: #dceaf5; background: linear-gradient(160deg, #24507a, #16344f);
    border: 1px solid #3a6a95; border-radius: 8px; cursor: pointer;
  }
  .i18n-btn:hover { filter: brightness(1.2); }
  .i18n-output {
    width: 100%; max-width: 900px;
    background: #0a0e14; border: 1px solid #223; border-radius: 8px;
    padding: 16px; font: 12px/1.7 "SF Mono", Menlo, monospace;
    color: #9ec; white-space: pre-wrap; word-break: break-all;
    max-height: 260px; overflow: auto; display: none;
  }
  .i18n-tip { font-size: 12px; color: #7a8; margin-top: 12px; min-height: 18px; }

  @media (prefers-reduced-motion: reduce) {
    .ygo-card:hover .foil, .ygo-card.revealed.sr .foil { opacity: .25; }
    .ygo-card:hover .foil::before, .ygo-card.revealed.sr .foil::before { animation: none; left: 30%; }
    .flip-inner { transition: none; }
    .ygo-card:hover { transform: none; }
  }
</style>
</head>
<body>

<h1>技 能 卡 牌 <span style="font-size:12px;color:#666;letter-spacing:1px">v2</span></h1>
<p class="sub">主题表驱动全分类配色（新分类自动生成色相）· 匀速闪卡扫光 · 抽卡翻面揭示 · 底部新增中文化提示词生成器</p>

<!-- 静态卡面：覆盖多个分组，含一个"自建新分类"的自动配色 -->
<div class="row static" id="staticRow"></div>

<!-- 抽卡演示 -->
<div class="gacha-stage">
  <h2>抽 卡 演 示 · 应 用 到 会 话</h2>
  <button class="gacha-btn" id="gachaBtn">抽 卡</button>
  <div class="gacha-row" id="gachaRow"></div>
  <div class="gacha-hint" id="gachaHint">点击抽卡：卡背飞入 → 逐张翻面揭示（间隔 400ms）→ SR 有金光与持续闪卡光泽 · 点击屏幕任意处可快进</div>
</div>

<!-- 中文化提示词生成器 -->
<div class="i18n-stage">
  <h2>技 能 中 文 化 · 提 示 词 生 成 器</h2>
  <p class="sub2">生成提示词 → 粘贴给当前对话框的 agent → agent 返回 JSON → 粘贴回来一键校验写入。<br>可整包批量，也可在单张卡片上单独转换（卡片左上角「译」按钮，同一条协议）。</p>
  <div class="i18n-actions">
    <button class="i18n-btn" id="genBatch">① 生成批量翻译提示词（复制）</button>
    <button class="i18n-btn" id="showSample">查看 agent 应返回的样例</button>
    <button class="i18n-btn" id="pasteApply">② 粘贴 agent 返回的 JSON 并写入</button>
  </div>
  <textarea class="i18n-output" id="i18nOut" rows="9" style="display:block" placeholder="① 点「生成批量翻译提示词」→ 自动复制 → 粘贴到对话框发送；② agent 回复 JSON 后全选复制，粘到这里再点「写入」"></textarea>
  <div class="i18n-tip" id="i18nTip"></div>
</div>

<script>
/* ================================================================
 * 1) 主题表：每个分类一套风格。新分类查不到 → 名字哈希自动生成色相
 * ================================================================ */
const THEMES = {
  "开发":      { frame: "#a05a22", dark: "#6b3a12", art: ["#4a3418", "#241a0c"], glyph: "⚒️" },
  "测试":      { frame: "#2e7d4f", dark: "#1b5232", art: ["#1a3a2a", "#0c1c14"], glyph: "🧪" },
  "设计":      { frame: "#7b3fa0", dark: "#52266d", art: ["#3a2050", "#1c0e28"], glyph: "✒️" },
  "写作·文档": { frame: "#3a7a8a", dark: "#205260", art: ["#1a3a44", "#0c1c22"], glyph: "📜" },
  "办公文档":  { frame: "#2a6a9a", dark: "#184462", art: ["#18344a", "#0a1826"], glyph: "📊" },
  "AI·智能体": { frame: "#2456a0", dark: "#153564", art: ["#182c50", "#0a1226"], glyph: "🔮" },
  "流程·工程": { frame: "#8a6a2f", dark: "#5c4418", art: ["#3c3018", "#1e180a"], glyph: "⚙️" },
  "研究·分析": { frame: "#5a6a8a", dark: "#38445c", art: ["#262e42", "#12161f"], glyph: "🔬" },
  "技能·管理": { frame: "#8a8540", dark: "#5c5826", art: ["#3c3a1c", "#1e1c0c"], glyph: "🗂️" },
  "安全":      { frame: "#8a2440", dark: "#5a1428", art: ["#3e1420", "#1e0a10"], glyph: "🛡️" },
  "数据":      { frame: "#2a7a6a", dark: "#185044", art: ["#16342e", "#0a1a16"], glyph: "🗂" },
  "常用":      { frame: "#b8862e", dark: "#7a5a1a", art: ["#443214", "#221a08"], glyph: "★" },
};
// 名字哈希 → 0-359 色相；饱和度/亮度锁定在"像卡框"的区间，任何新分类配色都和谐
function hashHue(str) { let h = 0; for (const ch of str) h = (h * 31 + ch.codePointAt(0)) % 360; return h; }
function autoTheme(name) {
  const h = hashHue(name);
  return {
    frame: `hsl(${h} 55% 42%)`,
    dark:  `hsl(${h} 55% 26%)`,
    art:   [`hsl(${h} 35% 16%)`, `hsl(${h} 40% 7%)`],
    glyph: "🃏",
    auto:  true,
  };
}
function themeOf(cat) { return THEMES[cat] || autoTheme(cat); }
function applyTheme(cardEl, cat) {
  const t = themeOf(cat);
  cardEl.style.setProperty("--frame-color", t.frame);
  cardEl.style.setProperty("--frame-dark",  t.dark);
  cardEl.style.setProperty("--frame-glow",  `color-mix(in srgb, ${t.frame} 55%, transparent)`);
  cardEl.style.setProperty("--art-grad",    `linear-gradient(150deg, ${t.art[0]}, ${t.art[1]} 60%, #0d1020)`);
}

/* ================================================================
 * 2) 示例数据：en 为英文原始态（来自 /skills）；
 *    zh / zhDesc 为中文卡名与描述（实际来自 skill-cards.json 的 i18n 字段）
 * ================================================================ */
const SKILLS = [
  { name: "algorithmic-art", cat: "设计",      lv: 3, atk: 128, en: "Creating algorithmic art using p5.js with seeded randomness and interactive parameter exploration.",
    zh: "算法艺术家",   zhDesc: "使用 p5.js 创建种子化随机算法艺术，支持交互式参数探索。本卡对「流场、粒子系统」拥有支配权。" },
  { name: "tdd",             cat: "测试",      lv: 4, atk: 326, en: "Test-driven development. Red-green-refactor.",
    zh: "测试仪式",     zhDesc: "红-绿-重构循环的守护者。当此卡存在于会话时，任何未经测试的逻辑都无法通过。" },
  { name: "frontend-design", cat: "设计",      lv: 2, atk: 54,  en: "Guidance for distinctive, intentional visual design.",
    zh: "前端造型师",   zhDesc: "为全新界面提供独特、有意图的视觉方向。拒绝模板化的默认审美。" },
  { name: "skill-creator",   cat: "AI·智能体", lv: 5, atk: 999, en: "Create new skills, edit and improve existing skills, measure skill performance.",
    zh: "技能创世神",   zhDesc: "从虚无中创造技能，亦可改造既有技能。可测量任意技能的触发精度与性能。", sr: true },
  { name: "security-and-hardening", cat: "安全", lv: 3, atk: 87, en: "Harden code against vulnerabilities and manage sessions safely.",
    zh: "安全壁垒",     zhDesc: "加固代码防线。任何不受信输入、会话管理与第三方集成，都将受到审判。" },
  { name: "doc-coauthoring", cat: "写作·文档", lv: 3, atk: 61,  en: "Guide users through a structured workflow for co-authoring documentation.",
    zh: "文档共笔向导", zhDesc: "以结构化流程引导多人共创文档、提案与决策稿。" },
  { name: "my-custom-thing", cat: "我的自建分类", lv: 1, atk: 7, en: "A user-created category demo skill.",
    zh: "自定义试验品", zhDesc: "演示自建分类的自动配色——框色由名字哈希生成，永不撞车也不会突兀。", customCat: true },
];

/* ---- 静态展示区渲染 ---- */
function staticCardHTML(s) {
  return `
    <div class="tag">${s.cat}${s.customCat ? ' <span class="auto">· 自动配色</span>' : ""}</div>
    <div class="ygo-card ${s.sr ? "revealed sr" : ""}" data-cat="${s.cat}" style="cursor:default">
      <div class="inner">
        <div class="card-name"><i class="elem-badge"></i>${s.zh}<span class="lv">${"★".repeat(s.lv)}${"☆".repeat(5 - s.lv)}</span></div>
        <div class="card-art"><span class="glyph">${themeOf(s.cat).glyph}</span></div>
        <div class="card-desc"><b>【技能·${s.zh}】</b><br>${s.zhDesc}</div>
        <div class="card-stats"><span class="cat">${s.cat}</span><span class="nums">ATK <span>${s.atk}</span> / 次</span></div>
      </div>
      <div class="foil"></div>
    </div>
    <div class="tag" style="color:#556;font-size:10px">${s.name}</div>`;
}
const staticRow = document.getElementById("staticRow");
SKILLS.forEach(s => {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.innerHTML = staticCardHTML(s);
  staticRow.appendChild(cell);
  applyTheme(cell.querySelector(".ygo-card"), s.cat);
});

/* ================================================================
 * 3) 抽卡流程
 * ================================================================ */
function gachaCardHTML(s) {
  return `
    <div class="flip-inner">
      <div class="flip-face front">
        <div class="ygo-card ${s.sr ? "revealed sr" : ""}" data-cat="${s.cat}">
          <div class="inner">
            <div class="card-name"><i class="elem-badge"></i>${s.zh}<span class="lv">${"★".repeat(s.lv)}${"☆".repeat(5 - s.lv)}</span></div>
            <div class="card-art"><span class="glyph">${themeOf(s.cat).glyph}</span></div>
            <div class="card-desc"><b>【技能·${s.zh}】</b><br>${s.zhDesc}</div>
            <div class="card-stats"><span class="cat">${s.cat}</span><span class="nums">ATK <span>${s.atk}</span> / 次</span></div>
          </div>
          <div class="foil"></div>
        </div>
      </div>
      <div class="flip-face back"><div class="card-backface"></div></div>
    </div>`;
}
const btn = document.getElementById("gachaBtn");
const row = document.getElementById("gachaRow");
const hint = document.getElementById("gachaHint");
let skip = false;

btn.addEventListener("click", () => {
  btn.disabled = true;
  skip = false;
  row.innerHTML = "";
  hint.textContent = "抽卡中……点击屏幕任意处可快进";
  const pool = [...SKILLS].sort(() => Math.random() - .5).slice(0, 4);
  const slots = pool.map(() => {
    const slot = document.createElement("div");
    slot.className = "gacha-slot card-back flip-scene";
    slot.innerHTML = `<div class="placeholder">?</div>`;
    row.appendChild(slot);
    return slot;
  });
  slots.forEach((slot, i) => setTimeout(() => {
    slot.innerHTML = gachaCardHTML(pool[i]);
    const inner = slot.firstElementChild;
    inner.style.opacity = 0;
    inner.style.transform = "translateY(60px) rotate(8deg) scale(.8)";
    inner.style.transition = "opacity .4s ease, transform .45s cubic-bezier(.2,.8,.3,1.2)";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      inner.style.opacity = 1;
      inner.style.transform = "none";
    }));
    applyTheme(slot.querySelector(".ygo-card"), pool[i].cat);
  }, skip ? 0 : i * 130));
  const revealDelay = skip ? 60 : 900;
  slots.forEach((slot, i) => setTimeout(() => {
    slot.classList.add("flipped");
    if (pool[i].sr) slot.classList.add("reveal-flash");
    setTimeout(() => slot.classList.remove("reveal-flash"), 1200);
  }, revealDelay + (skip ? 0 : i * 400)));
  setTimeout(() => {
    btn.disabled = false;
    hint.textContent = "揭示完毕 · SR 卡有金光爆闪与持续闪卡光泽 · 再次点击抽卡重新洗池";
  }, 1250 + (skip ? 0 : (pool.length - 1) * 400) + 400);
});
document.addEventListener("click", e => {
  if (btn.disabled && !e.target.closest(".gacha-slot") && !e.target.closest(".i18n-stage")) skip = true;
});

/* ================================================================
 * 4) 中文化提示词生成器（批量与单卡同一条协议）
 *    真实插件里：SKILLS ← GET /skills；写入 ← POST /cards-config 落盘 skill-cards.json
 * ================================================================ */
const out = document.getElementById("i18nOut");
const tip = document.getElementById("i18nTip");
const BUILD_PROMPT = items => `你是本地技能库的中文化助手。请把下面 JSON 里每个技能翻译成游戏王风格的中文名与描述：
- name → 中文卡名：2-6 字，简短有力（参考："tdd"→"测试仪式"、"skill-creator"→"技能创世神"）
- desc → 中文卡牌描述：60 字以内，风格戏剧化但功能描述必须准确，不得虚构能力

只返回 JSON 数组，不要任何解释或代码块标记，格式：
[{"name":"原始英文名(原样返回)","zh":"中文卡名","zhDesc":"中文描述"}]

待翻译列表：
${JSON.stringify(items, null, 2)}`;

document.getElementById("genBatch").addEventListener("click", async () => {
  const items = SKILLS.map(s => ({ name: s.name, desc: s.en }));
  const prompt = BUILD_PROMPT(items);
  out.value = prompt;
  try { await navigator.clipboard.writeText(prompt); tip.textContent = "✅ 提示词已复制到剪贴板，直接粘贴到对话框发给 agent"; }
  catch { tip.textContent = "⚠️ 自动复制失败，请手动全选复制上方文本"; }
});
document.getElementById("showSample").addEventListener("click", () => {
  out.value = JSON.stringify(SKILLS.slice(0, 3).map(s => ({ name: s.name, zh: s.zh, zhDesc: s.zhDesc })), null, 2);
  tip.textContent = "这是 agent 应返回的 JSON 样例（写入前会做结构校验）";
});
document.getElementById("pasteApply").addEventListener("click", () => {
  let data;
  try {
    const raw = out.value.trim().replace(/^```(json)?\s*|```\s*$/g, "");   // 容错：剥掉 agent 可能带的代码块标记
    data = JSON.parse(raw);
  } catch { tip.textContent = "❌ 解析失败：请粘贴 agent 返回的纯 JSON 数组"; return; }
  if (!Array.isArray(data) || !data.every(d => d.name && d.zh)) { tip.textContent = "❌ 结构不对：需要 [{name, zh, zhDesc?}]"; return; }
  // 真实插件里这里 POST /cards-config → 落盘 skill-cards.json 的 i18n 字段 → 前端刷新即生效
  tip.textContent = `✅ 校验通过，写入 ${data.length} 条：` + data.map(d => `${d.name}→${d.zh}`).join("、");
});
</script>
